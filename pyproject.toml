[project]
name = "time-zone-tabulator-lib"
version = "0.1.0"
description = "Locate IANA time zones sharing a UTC offset and DST state at a given moment."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
